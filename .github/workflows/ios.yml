name: iOS

on:
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit:
    name: ClearanceKit unit tests
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ios/ClearanceKit
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Test
        run: swift test

  app:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate project
        run: brew install xcodegen && xcodegen
      - name: Build for device (unsigned)
        run: |
          xcodebuild -project Clearance.xcodeproj -scheme Clearance -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Clearance.app Payload/
          zip -qry Clearance-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Clearance-unsigned-ipa
          path: apps/ios/Clearance-unsigned.ipa
          retention-days: 30
