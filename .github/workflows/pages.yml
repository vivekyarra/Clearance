name: Web console (GitHub Pages)

# Publishes the web console in offline mode: the three reference sites with their recorded Clearance checks,
# served as static files at https://vivekyarra.github.io/Clearance/.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (offline mode, served under /Clearance/)
        run: npm run build:offline
        env:
          CLEARANCE_WEB_BASE: /Clearance/
          VITE_OFFLINE: "1"  # apps/web/.env.offline is gitignored with the other .env files
      - name: Deep links open the app
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
